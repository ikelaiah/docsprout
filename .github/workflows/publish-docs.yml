name: Publish documentation

on:
  workflow_call:
    inputs:
      versioned:
        description: Build immutable versions.json history instead of one site
        required: false
        type: boolean
        default: true
      release:
        description: Release label for a single-version site
        required: false
        type: string
        default: preview

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install "git+https://github.com/ikelaiah/dockit-fp.git@v0.17.0"
      - run: dockit-fp check
      - if: inputs.versioned
        run: dockit-fp check-release
      - if: inputs.versioned
        run: dockit-fp build-all --output build/docs-site
      - if: ${{ ! inputs.versioned }}
        env:
          DOCKIT_RELEASE: ${{ inputs.release }}
        run: dockit-fp build --release "$DOCKIT_RELEASE" --output build/docs-site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs-site
      - id: deployment
        uses: actions/deploy-pages@v5
