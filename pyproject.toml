[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsprout"
version = "1.1.5"
description = "Versioned static documentation sites for code projects"
keywords = ["documentation", "static-site", "markdown", "github-pages"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "DocSprout contributors"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
]

[project.urls]
Homepage = "https://ikelaiah.github.io/docsprout/"
Documentation = "https://ikelaiah.github.io/docsprout/"
Repository = "https://github.com/ikelaiah/docsprout"
Changelog = "https://github.com/ikelaiah/docsprout/blob/main/CHANGELOG.md"
Issues = "https://github.com/ikelaiah/docsprout/issues"

[project.scripts]
docsprout = "docsprout.cli:main"
dockit-fp = "docsprout.cli:main_dockit_fp"

[project.optional-dependencies]
dev = ["build>=1.2", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docsprout = ["vendor/katex/**"]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = ["src/docsprout/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
